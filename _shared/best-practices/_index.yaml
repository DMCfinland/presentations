- name: pipeline-status-artifact-dependency
  title: PIPELINE STATUS — Mark Done Only After Artifact Confirmed Written
  category: orchestration
  summary: Status fields (status: done, status: complete) are metadata about physical artifacts. Write the artifact first using Write tool, confirm it exists, THEN update status. Reversing this order causes "done with no output" failures — status=done but no file on disk.
  applies_to: Any skill or pipeline that writes files and updates a status field
  when_to_use: Any time a skill has both a file-write step and a status-update step
  tier: A
  validated: true
  confidence: 1.0
  uses: 1
  last_used: S134
  source: patrick — 5 lost final docs in overnight research run, root cause confirmed

- name: single-runner-lockfile
  title: SINGLE RUNNER LOCKFILE — Prevent Concurrent Pipeline Instances
  category: orchestration
  summary: Any pipeline that reads+writes shared state files must use a lockfile to prevent concurrent instances. Without it, 2 runners cause race conditions, duplicate topic processing, and corrupted status fields. Pattern: check lockfile at start, write PID, remove in EXIT trap.
  applies_to: run-research-queue.sh and any batch runner that modifies shared YAML/JSON state
  when_to_use: Any shell script that runs a queue or batch job and shares state files with itself
  tier: A
  validated: true
  confidence: 1.0
  uses: 1
  last_used: S134
  source: S134 autopsy — 2 concurrent runners caused 36 Phase 1 runs for 22 topics (164% retry rate)

