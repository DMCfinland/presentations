<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <!-- Outer stamp border (notched rectangle) -->
  <rect x="4" y="4" width="102" height="102" rx="6" ry="6"
        fill="#003D8F" stroke="white" stroke-width="2.5"
        stroke-dasharray="4 3"/>

  <!-- Inner frame -->
  <rect x="10" y="10" width="90" height="90" rx="4" ry="4"
        fill="none" stroke="white" stroke-width="1" opacity="0.4"/>

  <!-- FIN text -->
  <text x="55" y="34" font-family="Georgia, serif" font-size="19"
        font-weight="700" fill="white" text-anchor="middle"
        letter-spacing="5">FIN</text>

  <!-- Finnish cross / + symbol (white cross = Finnish flag colours inverted) -->
  <!-- Horizontal bar -->
  <rect x="20" y="50" width="70" height="10" rx="1" fill="white"/>
  <!-- Vertical bar -->
  <rect x="50" y="28" width="10" height="54" rx="1" fill="white"/>

  <!-- LAND text -->
  <text x="55" y="94" font-family="Georgia, serif" font-size="19"
        font-weight="700" fill="white" text-anchor="middle"
        letter-spacing="4">LAND</text>
</svg>
